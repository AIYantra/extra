[package]
name = "extra-station"
version = "0.3.4"
description = "Extra Station — Sovereign Desktop Mission Control Cockpit"
authors = ["YantraOS"]
license = "Apache-2.0"
repository = "https://github.com/yantra-core/extra"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
