[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "extra-desktop"
version = "0.3.2"
description = "Flashless Linux, Windows & macOS Computer-Use Engine & Model Context Protocol (MCP) Server"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "AIYantra Engineering Team", email = "engineering@yantraos.com" }
]
dependencies = [
    "mcp>=1.0.0",
    "playwright>=1.47.0",
    "pillow>=10.4.0",
    "beautifulsoup4>=4.12.3",
    "imagehash>=4.3.1",
    "numpy>=1.26.0",
    "psutil>=6.0.0",
    "kuzu>=0.11.0",
    "fastembed>=0.8.0",
    "onnxruntime>=1.19.0",
    "pywin32>=306; sys_platform == 'win32'",
    "comtypes>=1.4.0; sys_platform == 'win32'",
    "mss>=9.0.1; sys_platform == 'win32'",
    "pyobjc-core>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-ScreenCaptureKit>=10.0; sys_platform == 'darwin'",
    "evdev>=1.7.0; sys_platform == 'linux'",
    "mss>=9.0.1; sys_platform == 'linux'",
    "jeepney>=0.8.0; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
benchmark = [
    "pytest-benchmark>=4.0.0",
]

[project.scripts]
extra = "extra.cli:main"
extra-desktop = "extra.cli:main"

[project.urls]
Homepage = "https://extra.yantraos.com"
Repository = "https://github.com/AIYantra/extra"
Documentation = "https://extra.yantraos.com/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:faulthandler"
markers = [
    "unit: Fast isolated unit tests with zero system dependencies",
    "integration: Subsystem integration tests",
    "windows: Tests requiring Windows Win32 / UIA subsystems",
    "linux: Tests requiring Linux X11 / Wayland / AT-SPI2 subsystems",
    "macos: Tests requiring macOS Quartz / Accessibility subsystems",
    "benchmark: Performance profiling and stress benchmark suites",
    "security: Security audit and vulnerability verification tests",
]

