[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "extra-desktop"
version = "0.2.5"
description = "Flashless Windows & macOS Computer-Use Engine & Model Context Protocol (MCP) Server"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "AIYantra Engineering Team", email = "engineering@yantraos.com" }
]
dependencies = [
    "mcp>=1.0.0",
    "playwright>=1.47.0",
    "pillow>=10.4.0",
    "beautifulsoup4>=4.12.3",
    "imagehash>=4.3.1",
    "numpy>=1.26.0",
    "psutil>=6.0.0",
    "kuzu>=0.11.0",
    "fastembed>=0.8.0",
    "pywin32>=306; sys_platform == 'win32'",
    "comtypes>=1.4.0; sys_platform == 'win32'",
    "mss>=9.0.1; sys_platform == 'win32'",
    "pyobjc-core>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-ScreenCaptureKit>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
extra = "extra.cli:main"

[project.urls]
Homepage = "https://extra.yantraos.com"
Repository = "https://github.com/AIYantra/extra"
Documentation = "https://extra.yantraos.com/docs"

[tool.setuptools.package-dir]
"extra" = "."
"extra.core" = "core"
"extra.core.platform" = "core/platform"
"extra.core.platform.windows" = "core/platform/windows"
"extra.core.platform.macos" = "core/platform/macos"
"extra.fastpath" = "fastpath"
"extra.mcp" = "mcp"
