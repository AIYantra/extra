name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to PyPI & Official MCP Registry
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for GitHub OIDC authentication with MCP Registry
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Distribution Packages
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Publish to PyPI
        continue-on-error: true
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "${TWINE_PASSWORD}" ]; then
            python -m pip install --upgrade twine
            twine upload dist/* --skip-existing || echo "::warning::PyPI upload skipped or failed"
          else
            echo "::notice::PYPI_API_TOKEN is not configured in repository secrets. Skipping PyPI upload."
          fi

      - name: Verify PyPI Package Availability
        env:
          HAS_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
        run: |
          python - << 'EOF'
          import json, os, sys, time, urllib.request

          with open("server.json") as f:
              data = json.load(f)

          packages = data.get("packages", [])
          if not packages:
              print("No packages declared in server.json")
              sys.exit(0)

          pkg = packages[0]
          identifier = pkg.get("identifier", "extra-desktop")
          version = pkg.get("version", data.get("version", ""))
          has_token = os.environ.get("HAS_TOKEN", "false").lower() == "true"

          print(f"Checking PyPI index for {identifier}=={version}...")
          url = f"https://pypi.org/pypi/{identifier}/json"

          max_attempts = 6 if has_token else 1
          available = False

          for attempt in range(1, max_attempts + 1):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "mcp-publisher-precheck"})
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      pypi_info = json.loads(resp.read().decode("utf-8"))
                      releases = pypi_info.get("releases", {})
                      if version in releases:
                          print(f"Confirmed: {identifier}=={version} is published and indexed on PyPI!")
                          available = True
                          break
                      else:
                          print(f"Attempt {attempt}/{max_attempts}: version {version} not yet indexed on PyPI.")
              except Exception as e:
                  print(f"Attempt {attempt}/{max_attempts}: {e}")
              if attempt < max_attempts:
                  time.sleep(10)

          env_file = os.environ.get("GITHUB_ENV")
          if env_file:
              with open(env_file, "a") as f:
                  f.write(f"PYPI_RELEASE_READY={'true' if available else 'false'}\n")
          EOF

      - name: Install mcp-publisher
        if: env.PYPI_RELEASE_READY == 'true'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (OIDC)
        if: env.PYPI_RELEASE_READY == 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish Server Manifest to Official MCP Registry
        if: env.PYPI_RELEASE_READY == 'true'
        continue-on-error: true
        run: ./mcp-publisher publish server.json

      - name: MCP Registry Deferred Notice
        if: env.PYPI_RELEASE_READY != 'true'
        run: |
          echo "::notice title=MCP Registry Publish Deferred::Registration on the Official MCP Registry was deferred because extra-desktop v0.2.0 is not yet live on PyPI. The official MCP Registry strictly requires PyPI packages to be published before registration. Configure PYPI_API_TOKEN in GitHub repository secrets and re-run this workflow to register."
