name: Publish Extra to PyPI & GitHub Releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Universal Distribution Wheels
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install Build Tooling
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build sdist and universal wheel
        run: |
          python -m build

      - name: Check Artifact Metadata with Twine
        run: |
          twine check dist/*

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 1

  test-matrix:
    name: Cross-Platform Pre-Flight Verification
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download Build Artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: python-package-distributions
          path: dist/

      - name: Install Built Wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          WHEEL=$(ls dist/*.whl | head -n 1)
          python -m pip install "${WHEEL}"

      - name: Run CLI Sanity Check
        shell: bash
        run: |
          extra doctor || true

  publish-pypi:
    name: Upload to PyPI
    needs: [build, test-matrix]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "${TWINE_PASSWORD}" ]; then
            echo "::warning::PYPI_API_TOKEN is not configured in repository secrets. Skipping PyPI upload."
            exit 0
          fi
          python -m pip install --upgrade twine
          twine upload dist/* --skip-existing || echo "::warning::Twine upload failed. Please verify PYPI_API_TOKEN permissions on pypi.org."

  publish-npm:
    name: Publish to npm (Trusted Publishing)
    needs: [build, test-matrix]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm to latest for OIDC Trusted Publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Publish to npm
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if npm view "@yantraos/extra-desktop@${CURRENT_VERSION}" version >/dev/null 2>&1; then
            echo "::notice::@yantraos/extra-desktop@${CURRENT_VERSION} is already published on npm. Skipping duplicate publish."
          else
            npm publish --access public --provenance
          fi

  release-github:
    name: Create GitHub Release
    needs: [build, test-matrix]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download Build Artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: python-package-distributions
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: dist/*
          generate_release_notes: true

      - name: Clean Up Temporary Build Artifacts from GitHub
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Cleaning up temporary build artifacts from GitHub Actions..."
          ARTIFACT_IDS=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts --jq '.artifacts[].id' || true)
          for id in $ARTIFACT_IDS; do
            echo "Deleting artifact $id..."
            gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/$id || true
          done
