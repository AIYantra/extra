name: Extra CI & System Diagnostics

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Cross-Platform Tests (${{ matrix.os }} - Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb at-spi2-core libx11-dev libxtst-dev

      - name: Install Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          python -m pip install -r requirements.txt pytest
          python -m pip install -e .

      - name: Run Extra System Doctor Diagnostics
        shell: bash
        run: |
          python -m extra.cli doctor || true

      - name: Run Full Unit & Integration Test Suite
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            xvfb-run python -m pytest tests -p no:faulthandler
          else
            python -m pytest tests -p no:faulthandler
          fi
