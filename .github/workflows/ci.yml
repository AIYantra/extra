name: Extra CI & System Diagnostics

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Cross-Platform Tests (${{ matrix.os }} - Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          python -m pip install -r requirements.txt pytest
          python -m pip install -e .

      - name: Run Extra System Doctor Diagnostics
        shell: bash
        run: |
          python -m extra.cli doctor || true

      - name: Run Full Unit & Integration Test Suite
        shell: bash
        run: |
          python -m unittest discover tests
